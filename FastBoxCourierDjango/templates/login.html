
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FastBox Courier - Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{
 background:#f4f6f3;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
}
.card{
 width:380px;
 border:0;
 border-radius:20px;
 box-shadow:0 8px 25px rgba(0,0,0,.12);
}
.logo{
 width:90px;
 height:90px;
 background:#a7cf45;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 margin:auto;
 font-size:32px;
 font-weight:bold;
 color:#1f241f;
}
.btn-fastbox{
 background:#a7cf45;
 border:0;
 font-weight:bold;
}
</style>
</head>
<body>
<div class="card p-4">
<div class="logo mb-3">FB</div>
<h3 class="text-center">FastBox Courier</h3>
<p class="text-center text-muted">Ingreso al sistema</p>

{% if mensaje %}
<div class="alert alert-danger">{{mensaje}}</div>
{% endif %}

<form method="post">
{% csrf_token %}

<input class="form-control mb-3" name="username" placeholder="Usuario">

<input class="form-control mb-3" type="password" name="password" placeholder="Contraseña">

<button class="btn btn-fastbox w-100">
Ingresar
</button>

</form>
</div>
</body>
</html>
